<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de professor — Sistema Acadêmico</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="textura">

<header class="topbar">
  <a href="../index.html" class="brand"><span class="selo">SA</span> Sistema Acadêmico</a>
  <nav class="topbar-links">
    <a href="login.html">Já tenho cadastro</a>
  </nav>
</header>

<div class="shell-narrow">
  <div class="auth-titulo">
    <div class="selo-grande">📖</div>
    <h1>Cadastro de professor</h1>
    <p style="color:var(--muted)">Preencha seus dados para acessar o painel de turmas.</p>
  </div>

  <div class="painel">
    <div class="msg-erro" id="erro"></div>

    <form id="formCadastro">
      <div class="campo">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" placeholder="Ex: Marcos Andrade" required>
        <span class="ajuda">Apenas letras e espaços.</span>
      </div>

      <div class="linha-2">
        <div class="campo">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" placeholder="Somente números" maxlength="11" required>
        </div>
        <div class="campo">
          <label for="telefone">Telefone</label>
          <input type="text" id="telefone" placeholder="Somente números, com DDD" maxlength="11" required>
        </div>
      </div>

      <div class="campo">
        <label for="especialidade">Especialidade</label>
        <input type="text" id="especialidade" placeholder="Ex: Estruturas de Dados" required>
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Mínimo 8 caracteres" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Criar cadastro</button>
    </form>
  </div>

  <p class="auth-rodape">Já é professor? <a href="login.html">Entrar</a></p>
</div>

<footer class="rodape"><a href="../index.html">Voltar à página inicial</a></footer>

<script src="../js/db.js"></script>
<script src="../js/auth.js"></script>
<script>
  document.getElementById('formCadastro').addEventListener('submit', (e) => {
    e.preventDefault();
    esconderErro('erro');

    try {
      const professor = DB.Professor.criar({
        nome: document.getElementById('nome').value,
        cpf: document.getElementById('cpf').value.trim(),
        telefone: document.getElementById('telefone').value.trim(),
        senha: document.getElementById('senha').value,
        especialidade: document.getElementById('especialidade').value,
      });

      DB.Sessao.entrar('professor', professor.matricula);
      window.location.href = 'dashboard.html';
    } catch (err) {
      mostrarErro('erro', err.message);
    }
  });
</script>

</body>
</html>
