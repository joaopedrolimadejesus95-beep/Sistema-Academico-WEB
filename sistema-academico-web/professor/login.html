<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Professor — Sistema Acadêmico</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="textura">

<header class="topbar">
  <a href="../index.html" class="brand"><span class="selo">SA</span> Sistema Acadêmico</a>
  <nav class="topbar-links">
    <a href="cadastro.html">Criar cadastro</a>
  </nav>
</header>

<div class="shell-narrow">
  <div class="auth-titulo">
    <div class="selo-grande">📖</div>
    <h1>Entrar como professor</h1>
    <p style="color:var(--muted)">Use sua matrícula ou e-mail institucional.</p>
  </div>

  <div class="painel">
    <div class="msg-erro" id="erro"></div>

    <form id="formLogin">
      <div class="campo">
        <label for="identificador">Matrícula ou e-mail</label>
        <input type="text" id="identificador" placeholder="Ex: 1 ou marcos.andrade1@email.prof.com" required>
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Entrar</button>
    </form>
  </div>

  <p class="auth-rodape">Ainda não tem cadastro? <a href="cadastro.html">Criar cadastro</a></p>
</div>

<footer class="rodape"><a href="../index.html">Voltar à página inicial</a></footer>

<script src="../js/db.js"></script>
<script src="../js/auth.js"></script>
<script>
  document.getElementById('formLogin').addEventListener('submit', (e) => {
    e.preventDefault();
    esconderErro('erro');

    const identificador = document.getElementById('identificador').value.trim();
    const senha = document.getElementById('senha').value;

    const professor = DB.Professor.buscarPorEmailOuMatricula(identificador);

    if (!professor || professor.senha !== senha) {
      mostrarErro('erro', 'Matrícula/e-mail ou senha incorretos.');
      return;
    }

    DB.Sessao.entrar('professor', professor.matricula);
    window.location.href = 'dashboard.html';
  });
</script>

</body>
</html>
