<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de estudante — Sistema Acadêmico</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="textura">

<header class="topbar">
  <a href="../index.html" class="brand"><span class="selo">SA</span> Sistema Acadêmico</a>
  <nav class="topbar-links">
    <a href="login.html">Já tenho cadastro</a>
  </nav>
</header>

<div class="shell-narrow">
  <div class="auth-titulo">
    <div class="selo-grande">🎓</div>
    <h1>Cadastro de estudante</h1>
    <p style="color:var(--muted)">Preencha seus dados para acessar o painel acadêmico.</p>
  </div>

  <div class="painel">
    <div class="msg-erro" id="erro"></div>
    <div class="msg-ok" id="ok"></div>

    <form id="formCadastro">
      <div class="campo">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" placeholder="Ex: Ana Beatriz Ramos" required>
        <span class="ajuda">Apenas letras e espaços.</span>
      </div>

      <div class="linha-2">
        <div class="campo">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" placeholder="Somente números" maxlength="11" required>
        </div>
        <div class="campo">
          <label for="dataNasc">Data de nascimento</label>
          <input type="date" id="dataNasc" required>
        </div>
      </div>

      <div class="campo">
        <label for="curso">Curso</label>
        <select id="curso" required></select>
        <span class="ajuda" id="ajudaCurso"></span>
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Mínimo 8 caracteres" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Criar cadastro</button>
    </form>
  </div>

  <p class="auth-rodape">Já é aluno? <a href="login.html">Entrar</a></p>
</div>

<footer class="rodape"><a href="../index.html">Voltar à página inicial</a></footer>

<script src="../js/db.js"></script>
<script src="../js/auth.js"></script>
<script>
  const selectCurso = document.getElementById('curso');
  const cursos = DB.Curso.listar();

  if (cursos.length === 0) {
    selectCurso.innerHTML = '<option value="">Nenhum curso cadastrado</option>';
    selectCurso.disabled = true;
    document.getElementById('ajudaCurso').innerHTML =
      'Nenhum curso foi cadastrado ainda. Peça para a <a href="../admin/index.html">coordenação cadastrar um curso</a> primeiro.';
    document.querySelector('#formCadastro button[type="submit"]').disabled = true;
  } else {
    selectCurso.innerHTML = cursos
      .map((c) => `<option value="${c.codigo}">${c.nome} (${c.codigo})</option>`)
      .join('');
  }

  document.getElementById('formCadastro').addEventListener('submit', (e) => {
    e.preventDefault();
    esconderErro('erro');

    try {
      const aluno = DB.Aluno.criar({
        nome: document.getElementById('nome').value,
        cpf: document.getElementById('cpf').value.trim(),
        senha: document.getElementById('senha').value,
        cursoCodigo: selectCurso.value,
        dataNasc: document.getElementById('dataNasc').value,
      });

      DB.Sessao.entrar('aluno', aluno.matricula);
      window.location.href = 'dashboard.html';
    } catch (err) {
      mostrarErro('erro', err.message);
    }
  });
</script>

</body>
</html>
